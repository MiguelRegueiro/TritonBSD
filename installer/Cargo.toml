[package]
name = "triton-installer-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
anyhow = "1.0"
crossterm = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
ratatui-image = { version = "11.0", default-features = false, features = ["crossterm"] }
signal-hook = "0.3.18"
unicode-width = "0.2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "unwind"
